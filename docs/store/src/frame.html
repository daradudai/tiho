<!doctype html>
<!-- One 1280×800 store screenshot: a caption band on top, captures of the real extension below.
     extension/tests/tools/store-assets.mjs (compose) opens this page with the spec as JSON in the hash:
       { caption, sub?, items: [{ src, w, h, label? }], notes?: [{ k, v }] }
     src is a file:// URL of a capture taken at 2× device pixels; w × h is the size it is drawn at (CSS px). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiho store screenshot</title>
<style>
  :root {
    --bg: #0b0c14; --bg-2: #11131e; --line: #23273a;
    --text: #e8e9f3; --muted: #9aa0b8; --dim: #6b7190;
    --a1: #7c83ff; --a2: #a78bfa; --a3: #5ab2ff;
    --grad: linear-gradient(120deg, var(--a1), var(--a2) 55%, var(--a3));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body { position: relative; background: var(--bg); color: var(--text); font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: absolute; width: 1100px; height: 1100px; left: 50%; top: 120px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(124, 131, 255, 0.16), transparent 70%); pointer-events: none; }

  .band { position: relative; height: 150px; padding: 30px 64px 0; display: flex; justify-content: space-between; gap: 40px; }
  .band h1 { margin: 0; font-size: 44px; line-height: 1.12; letter-spacing: -0.025em; font-weight: 700; }
  .band p { margin: 10px 0 0; font-size: 21px; color: var(--muted); }
  .brand { flex: none; display: flex; align-items: center; gap: 10px; height: 50px; font-weight: 700; font-size: 26px; letter-spacing: -0.02em; color: var(--text); }
  .brand svg { width: 34px; height: 34px; }

  .stage { position: relative; height: 650px; display: flex; justify-content: center; align-items: flex-start; gap: 36px; padding-top: 4px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .item .label { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
  .item img { display: block; border-radius: 14px; border: 1px solid #2b2e42; box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55); object-fit: cover; object-position: top; background: #18181b; }

  .notes { align-self: center; display: grid; gap: 22px; width: 300px; margin-top: -40px; }
  .note b { display: inline-block; font-size: 15px; font-weight: 700; color: #c7cbff; background: #23264a; border: 1px solid #34386a; padding: 3px 12px; border-radius: 999px; }
  .note span { display: block; margin-top: 7px; font-size: 18px; line-height: 1.4; color: var(--muted); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="4" y1="3" x2="29" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c83ff"/><stop offset="0.55" stop-color="#a78bfa"/><stop offset="1" stop-color="#5ab2ff"/>
    </linearGradient>
    <symbol id="mark" viewBox="0 0 32 32">
      <path d="M16 3.5C22.9 3.5 28.5 8.2 28.5 14C28.5 19.8 22.9 24.5 16 24.5C14.5 24.5 13.1 24.3 11.8 23.9C10.2 25.4 7.9 26.6 5.2 27C6.4 25.6 7.1 24 7.3 22.4C4.9 20.5 3.5 17.4 3.5 14C3.5 8.2 9.1 3.5 16 3.5Z" fill="url(#g)"/>
      <path d="M9 14 C9.75 9.47 11.25 9.47 12 14 C12.75 17.07 14.25 17.07 15 14 C15.75 12.53 17.25 12.53 18 14 C18.63 14.47 19.88 14.47 20.5 14 C21.13 14 22.38 14 23 14" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>
<header class="band">
  <div><h1 id="caption"></h1><p id="sub"></p></div>
  <div class="brand"><svg><use href="#mark"/></svg>Tiho</div>
</header>
<main class="stage" id="stage"></main>
<script>
  const spec = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  document.getElementById('caption').textContent = spec.caption;
  const sub = document.getElementById('sub');
  if (spec.sub) sub.textContent = spec.sub; else sub.remove();
  const stage = document.getElementById('stage');
  const notes = (spec.notes ?? []).length ? Object.assign(document.createElement('div'), { className: 'notes' }) : null;
  for (const n of spec.notes ?? []) {
    const d = Object.assign(document.createElement('div'), { className: 'note' });
    d.append(Object.assign(document.createElement('b'), { textContent: n.k }), Object.assign(document.createElement('span'), { textContent: n.v }));
    notes.append(d);
  }
  if (notes && spec.notesFirst) stage.append(notes);
  for (const it of spec.items) {
    const d = Object.assign(document.createElement('div'), { className: 'item' });
    if (it.label) d.append(Object.assign(document.createElement('div'), { className: 'label', textContent: it.label }));
    const img = Object.assign(document.createElement('img'), { src: it.src, alt: '' });
    img.style.width = `${it.w}px`;
    img.style.height = `${it.h}px`;
    d.append(img);
    stage.append(d);
  }
  if (notes && !spec.notesFirst) stage.append(notes);
  Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => document.body.setAttribute('data-ready', '1'));
</script>
</body>
</html>
