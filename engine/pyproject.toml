[project]
name = "hush-engine"
version = "0.1.0"
description = "Hush Engine: local GPU server for custom natural-language chat filters (Clef-Flash via llama.cpp)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hush-engine = "hush_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hush_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: talks to a real llama-server (skipped if unreachable)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
